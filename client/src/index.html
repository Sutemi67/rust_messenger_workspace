<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Young & successful chat</title>
    <style>
        body { font-family: sans-serif; background: #2d2d2d; color: #eee; display: flex; height: 100vh; margin: 0; }
        .hidden { display: none !important; }
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
        #login-screen input, #login-screen button { padding: 10px; margin: 5px; font-size: 16px; border-radius: 4px; border: 1px solid #555; background: #3c3c3c; color: #eee; }
        #chat-screen { display: flex; width: 100%; flex-direction: column; }
        #chat-layout { display: flex; flex: 1; overflow: hidden; }
        #sidebar { width: 200px; background: #252526; padding: 0; border-right: 1px solid #444; overflow-y: auto; display: flex; flex-direction: column; }
        #sidebar h3 { padding: 10px 15px; margin: 0; }
        #sidebar ul { list-style: none; padding: 0; margin: 0; }
        #sidebar li { padding: 8px 15px; cursor: pointer; }
        #sidebar li:hover { background: #333; }
        #sidebar li.active { background: #094771; }
        .sidebar-section { padding: 5px 0; }
        .sidebar-section .section-header { padding: 5px 15px; color: #888; font-size: 12px; text-transform: uppercase; }
        #main { flex: 1; display: flex; flex-direction: column; padding: 15px; }
        #chat-header { padding-bottom: 8px; border-bottom: 1px solid #444; margin-bottom: 10px; }
        #messages { flex: 1; overflow-y: auto; background: #1e1e1e; padding: 10px; border-radius: 5px; margin-bottom: 10px; }
        #input-area { display: flex; gap: 10px; }
        #msg-input { flex: 1; padding: 10px; background: #3c3c3c; border: 1px solid #555; color: #eee; border-radius: 4px; font-size: 16px; }
        #msg-input:disabled { opacity: 0.5; }
        button { padding: 10px 20px; background: #0e639c; border: none; color: #fff; cursor: pointer; border-radius: 4px; font-size: 16px; }
        button:hover { background: #1177bb; }
        button:disabled { opacity: 0.5; cursor: default; }
        button:disabled:hover { background: #0e639c; }
        .msg-system { color: #888; font-style: italic; }
        #status-bar { padding: 6px 15px; text-align: center; font-size: 13px; font-weight: bold; }
        #status-bar.disconnected { background: #5a1d1d; color: #ff6b6b; }
        #status-bar.connected { background: #1d5a1d; color: #6bff6b; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>Вход в чат</h2>
        <p>Введите ваш никнейм для подключения:</p>
        <input type="text" id="username-input" placeholder="Никнейм...">
        <button onclick="connect()">Подключиться</button>
    </div>

    <div id="chat-screen" class="hidden">
        <div id="status-bar" class="disconnected">⚠ Отключено от сервера. Переподключение...</div>
        <div id="chat-layout">
            <div id="sidebar">
                <h3>Молодые и успешные</h3>
                <div class="sidebar-section">
                    <div class="section-header">Каналы</div>
                    <ul>
                        <li id="global-chat" class="active" onclick="selectChat('global')">🌐 Общий чат</li>
                    </ul>
                </div>
                <div class="sidebar-section">
                    <div class="section-header">В сети</div>
                    <ul id="users-list"></ul>
                </div>
            </div>
            <div id="main">
                <div id="chat-header"><h3 id="chat-title">Общий чат</h3></div>
                <div id="messages"></div>
                <div id="input-area">
                    <input type="text" id="msg-input" placeholder="Введите сообщение..." disabled onkeydown="if(event.key === 'Enter') sendMessage()">
                    <button id="send-btn" onclick="sendMessage()" disabled>Послать</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws;
        let username = "";
        let selectedChat = "global";
        let allHistory = [];
        let allUsers = [];
        let connected = false;
        let reconnectTimer = null;

        function setConnected(status) {
            connected = status;
            const bar = document.getElementById('status-bar');
            const input = document.getElementById('msg-input');
            const sendBtn = document.getElementById('send-btn');
            if (status) {
                bar.className = 'connected';
                bar.textContent = '🟢 Подключено к серверу';
                input.disabled = false;
                sendBtn.disabled = false;
                input.focus();
            } else {
                bar.className = 'disconnected';
                bar.textContent = '⚠ Отключено от сервера. Переподключение...';
                input.disabled = true;
                sendBtn.disabled = true;
            }
        }

        function connect() {
            username = document.getElementById('username-input').value.trim();
            if (!username) return;

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            addSystemMessage("Подключение к серверу...");
            startConnection();
        }

        function startConnection() {
            ws = new WebSocket("/ws");

            ws.onopen = () => {
                ws.send(username);
                setConnected(true);
                addSystemMessage("Подключение установлено");
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleEvent(data);
            };

            ws.onclose = () => {
                setConnected(false);
                addSystemMessage("Соединение разорвано. Переподключение через 5 сек...");
                scheduleReconnect();
            };

            ws.onerror = () => {
                ws.close();
            };
        }

        function scheduleReconnect() {
            if (reconnectTimer) clearTimeout(reconnectTimer);
            reconnectTimer = setTimeout(() => {
                addSystemMessage("Попытка переподключения...");
                startConnection();
            }, 5000);
        }

        function handleEvent(event) {
            if (event.type === "Message") {
                allHistory.push(event);
                renderMessages();
                if (event.payload.user !== username) {
                    playBeep();
                }
            } else if (event.type === "SyncUsers") {
                allUsers = event.payload;
                updateUsers();
            } else if (event.type === "UserJoined") {
                allHistory.push({ type: "UserJoined", payload: event.payload });
                renderMessages();
            } else if (event.type === "UserLeft") {
                allHistory.push({ type: "UserLeft", payload: event.payload });
                renderMessages();
            }
        }

        function selectChat(chat) {
            selectedChat = chat;
            document.querySelectorAll('#sidebar li').forEach(el => el.classList.remove('active'));
            if (chat === 'global') {
                document.getElementById('global-chat').classList.add('active');
                document.getElementById('chat-title').textContent = 'Общий чат';
            } else {
                const user = chat.replace('user:', '');
                const li = document.querySelector(`#users-list li[data-user="${user}"]`);
                if (li) li.classList.add('active');
                document.getElementById('chat-title').textContent = 'Чат с ' + user;
            }
            renderMessages();
            if (connected) document.getElementById('msg-input').focus();
        }

        function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (text && ws && connected) {
                let recipient = null;
                if (selectedChat !== 'global') {
                    recipient = selectedChat.replace('user:', '');
                }
                const msg = { text: text, recipient: recipient };
                ws.send(JSON.stringify(msg));
                input.value = '';
            }
        }

        function addSystemMessage(text) {
            allHistory.push({ type: "UserJoined", payload: text });
            renderMessages();
        }

        function shouldShow(event) {
            if (event.type === "UserJoined" || event.type === "UserLeft") {
                return selectedChat === 'global';
            }
            if (event.type === "Message") {
                const recip = event.payload.recipient;
                if (selectedChat === 'global') {
                    return recip === null;
                } else {
                    const other = selectedChat.replace('user:', '');
                    return (event.payload.user === username && recip === other)
                        || (event.payload.user === other && recip === username);
                }
            }
            return false;
        }

        function formatMessage(event) {
            if (event.type === "UserJoined") {
                return '<div class="msg-system">' + escapeHtml(event.payload) + '</div>';
            } else if (event.type === "UserLeft") {
                return '<div class="msg-system">' + escapeHtml(event.payload) + ' покинул чат</div>';
            } else if (event.type === "Message") {
                return '<div><b>' + escapeHtml(event.payload.user) + ':</b> ' + escapeHtml(event.payload.text) + '</div>';
            }
            return '';
        }

        function renderMessages() {
            const msgBox = document.getElementById('messages');
            msgBox.innerHTML = '';
            allHistory.forEach(event => {
                if (shouldShow(event)) {
                    msgBox.insertAdjacentHTML('beforeend', formatMessage(event));
                }
            });
            msgBox.scrollTop = msgBox.scrollHeight;
        }

        function updateUsers() {
            const list = document.getElementById('users-list');
            list.innerHTML = '';
            allUsers.forEach(u => {
                if (u === username) return;
                const li = document.createElement('li');
                li.textContent = '👤 ' + u;
                li.dataset.user = u;
                li.onclick = () => selectChat('user:' + u);
                if (selectedChat === 'user:' + u) {
                    li.classList.add('active');
                }
                list.appendChild(li);
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function playBeep() {
            if (document.hidden) {
                const audio = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbsGczIj+a3teleTk8');
                audio.play().catch(e => console.log("Браузер заблокировал авто-воспроизведение звука"));
            }
        }
    </script>
</body>
</html>
