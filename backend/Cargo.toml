[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
serde_json = "1.0"
futures-util = { version = "0.3", features = ["sink"] }

shared = { path = "../shared" }